name: index.htmlをConoHaにFTPアップロード

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

jobs:
  upload-index:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: index.htmlをFTPアップロード
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<EOF
          import ftplib, os
          host     = os.environ.get('FTP_HOST','').strip()
          user     = os.environ.get('FTP_USER','').strip()
          password = os.environ.get('FTP_PASS','').strip()
          remote   = '/home/c9048134/public_html/oyatojikka.online/index.html'
          if not host:
              print('FTP環境変数未設定。スキップ')
              exit(0)
          try:
              with ftplib.FTP(timeout=60) as ftp:
                  ftp.connect(host, 21)
                  ftp.login(user, password)
                  ftp.set_pasv(True)
                  with open('index.html', 'rb') as f:
                      ftp.storbinary(f'STOR {remote}', f)
              print('FTPアップロード完了: index.html')
          except Exception as e:
              print(f'FTPエラー: {e}')
              exit(1)
          EOF
