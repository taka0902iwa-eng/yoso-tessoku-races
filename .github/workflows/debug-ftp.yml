name: FTPデバッグ - keiba.html確認
on:
  workflow_dispatch:
jobs:
  debug-ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: サーバーのkeiba.htmlを確認
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os, io
          host = os.environ.get('FTP_HOST','').strip()
          user = os.environ.get('FTP_USER','').strip()
          password = os.environ.get('FTP_PASS','').strip()
          if not host:
              print('FTP未設定')
              exit(0)
          with ftplib.FTP(timeout=60) as ftp:
              ftp.connect(host, 21)
              ftp.login(user, password)
              ftp.set_pasv(True)
              # ディレクトリ確認
              print("=== /home/c9048134/public_html/oyatojikka.online ===")
              ftp.retrlines('LIST /home/c9048134/public_html/oyatojikka.online')
              # keiba.htmlのr.reason行を確認
              buf = io.BytesIO()
              ftp.retrbinary('RETR /home/c9048134/public_html/oyatojikka.online/keiba.html', buf.write)
              content = buf.getvalue().decode('utf-8', errors='replace')
              lines = content.split('\n')
              print(f"\n=== keiba.htmlのr.reason行 (total {len(lines)} lines) ===")
              for i, line in enumerate(lines, 1):
                  if 'r.reason' in line:
                      print(f"Line {i}: {line.strip()[:200]}")
          PYEOF
