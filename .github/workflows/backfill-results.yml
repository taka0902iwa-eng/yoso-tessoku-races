name: 過去分結果バックフィル
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日'
        default: '2026-04-14'
      end_date:
        description: '終了日'
        default: '2026-04-19'
jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install requests beautifulsoup4 lxml matplotlib
      - name: backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: |
          python3 -c "
          import os
          from datetime import datetime, timedelta
          from result_updater import run_result_update
          start = datetime.strptime('${{ github.event.inputs.start_date }}', '%Y-%m-%d')
          end = datetime.strptime('${{ github.event.inputs.end_date }}', '%Y-%m-%d')
          d = start
          while d <= end:
              ds = d.strftime('%Y-%m-%d')
              if os.path.exists(f'races_{ds}.json'):
                  print(f'処理: {ds}')
                  run_result_update(target_date=ds)
              else:
                  print(f'スキップ: {ds}')
              d += timedelta(days=1)
          "
      - name: Gitコミット（results.json更新）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json ev_calibration.json profit_chart.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: backfill results.json更新"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-${{ github.run_id }}
          path: results.json
          retention-days: 7
