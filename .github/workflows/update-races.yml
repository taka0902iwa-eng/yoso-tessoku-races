name: 毎朝レース情報自動更新
on:
  schedule:
    - cron: '30 23 * * *'   # JST 08:30
    - cron: '30 1  * * *'   # JST 10:30
    - cron: '30 3  * * *'   # JST 12:30
  workflow_dispatch:         # 手動実行ボタンあり
jobs:
  update-races:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存パッケージインストール
        run: |
          pip install requests beautifulsoup4 lxml matplotlib
      - name: スクレイピング＋EV計算＋FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: python scraper.py
      - name: 今日のraces.jsonをGitHubにコミット保存（翌日の結果照合用）
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          cp races.json races_${TODAY}.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add races_${TODAY}.json
          git diff --cached --quiet || git commit -m "auto: races_${TODAY}.json を保存"
          git push
      - name: 昨日のレース結果を取得してresults.jsonを更新・FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: |
          python3 -c "
          import json, os
          # GitHubリポジトリ内のresults.jsonを使用（Nginxキャッシュ問題を回避）
          if os.path.exists('results.json'):
              with open('results.json', encoding='utf-8') as f:
                  data = json.load(f)
              records = data.get('records', [])
              print(f'results.json読み込み成功: {len(records)}件')
              # サンプルデータが混入していれば除去
              sample_races = {'桜花賞','ニュージーランドT','SGオールスター','大阪杯','日本選手権競輪','高松宮記念','SG笹川賞','スプリングS','高松宮記念杯','チューリップ賞'}
              real = [r for r in records if r.get('name', r.get('race', '')) not in sample_races]
              if len(real) != len(records):
                  print(f'サンプルデータ{len(records)-len(real)}件を除去')
                  data['records'] = real
                  with open('results.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
          else:
              print('results.json なし（新規作成）')
              with open('results.json','w',encoding='utf-8') as f:
                  json.dump({'summary':{},'by_sport':{},'by_venue':{},'records':[]}, f, ensure_ascii=False)
          "
          python result_updater.py
      - name: races.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('races.json') as f:
                  d = json.load(f)
              races = d.get('races', [])
              print(f'合計: {len(races)}件')
              for sport in ['horse','boat','cycle']:
                  n = len([r for r in races if r.get('sport')==sport])
                  print(f'  {sport}: {n}件')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: results.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('results.json') as f:
                  d = json.load(f)
              s = d.get('summary', {})
              print(f'総戦数: {s.get(\"total\",0)}件')
              print(f'的中率: {s.get(\"hit_rate\",0)}%')
              print(f'収支: +¥{s.get(\"profit\",0):,}')
              records = d.get('records', [])
              print(f'レコード数: {len(records)}件')
              if records:
                  print(f'最新: {records[0].get(\"date\",\"\")} {records[0].get(\"name\",\"\")} {records[0].get(\"result\",\"\")}')
              # 競技別・場所別集計
              by_sport = d.get('by_sport', {})
              for sp, v in by_sport.items():
                  if v.get('total', 0) > 0:
                      print(f'  {sp}: {v[\"total\"]}戦 {v[\"hit_rate\"]}%的中 回収率{v[\"recovery_rate\"]}%')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: LINE配信テキスト確認
        run: cat line_message.txt 2>/dev/null || echo "line_message.txt なし"
      - name: 生成ファイルを Artifact として保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: races-json-${{ github.run_id }}
          path: |
            races.json
            results.json
            ev_calibration.json
            profit_chart.png
            line_message.txt
          retention-days: 7
