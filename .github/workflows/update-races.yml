name: 毎朝レース情報自動更新
on:
  schedule:
    - cron: '30 23 * * *'   # JST 08:30
    - cron: '30 1  * * *'   # JST 10:30
    - cron: '30 3  * * *'   # JST 12:30
  workflow_dispatch:         # 手動実行ボタンあり
jobs:
  update-races:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存パッケージインストール
        run: |
          pip install requests beautifulsoup4 lxml
      - name: スクレイピング＋EV計算＋FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: python scraper.py
      - name: 昨日のレース結果を取得してresults.jsonを更新・FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: |
          python3 -c "
          import urllib.request, json, os
          try:
              url = 'https://oyatojikka.online/results.json'
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  data = json.loads(r.read())
              with open('results.json','w',encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f'results.json取得成功: {len(data.get(chr(114)+chr(101)+chr(99)+chr(111)+chr(114)+chr(100)+chr(115),[]))}件')
          except Exception as e:
              print(f'results.json取得失敗（新規作成）: {e}')
              with open('results.json','w',encoding='utf-8') as f:
                  json.dump({'summary':{},'by_sport':{},'records':[]}, f, ensure_ascii=False)
          "
          python result_updater.py
      - name: races.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('races.json') as f:
                  d = json.load(f)
              races = d.get('races', [])
              print(f'合計: {len(races)}件')
              for sport in ['horse','boat','cycle']:
                  n = len([r for r in races if r.get('sport')==sport])
                  print(f'  {sport}: {n}件')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: results.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('results.json') as f:
                  d = json.load(f)
              s = d.get('summary', {})
              print(f'総戦数: {s.get(\"total\",0)}件')
              print(f'的中率: {s.get(\"hit_rate\",0)}%')
              print(f'収支: +¥{s.get(\"profit\",0):,}')
              records = d.get('records', [])
              print(f'レコード数: {len(records)}件')
              if records:
                  print(f'最新: {records[0].get(\"date\",\"\")} {records[0].get(\"name\",\"\")} {records[0].get(\"result\",\"\")}')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: LINE配信テキスト確認
        run: cat line_message.txt 2>/dev/null || echo "line_message.txt なし"
      - name: 生成ファイルを Artifact として保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: races-json-${{ github.run_id }}
          path: |
            races.json
            results.json
            ev_calibration.json
            line_message.txt
          retention-days: 7
