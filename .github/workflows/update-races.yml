name: 毎朝レース情報自動更新

on:
  schedule:
    - cron: '30 23 * * *'   # JST 08:30
    - cron: '30 1  * * *'   # JST 10:30（追加：午前中の更新）
    - cron: '30 3  * * *'   # JST 12:30（追加：昼の更新）
  workflow_dispatch:         # 手動実行ボタンあり

jobs:
  update-races:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: |
          pip install requests beautifulsoup4 lxml

      - name: スクレイピング＋EV計算＋FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: python scraper.py

      - name: races.json の内容確認
        run: |
          echo "=== races.json (先頭50行) ==="
          head -50 races.json || echo "races.json が生成されませんでした"
          echo ""
          echo "=== レース件数 ==="
          python3 -c "
          import json
          try:
              with open('races.json') as f:
                  d = json.load(f)
              races = d.get('races', [])
              print(f'合計: {len(races)}件')
              for sport in ['horse','boat','cycle']:
                  n = len([r for r in races if r.get('sport')==sport])
                  print(f'  {sport}: {n}件')
              # 時刻が--:--のレース数
              no_time = len([r for r in races if r.get('time','--:--')=='--:--'])
              print(f'  時刻不明: {no_time}件')
              # honmeiが空のレース数
              no_honmei = len([r for r in races if not r.get('honmei','')])
              print(f'  本命なし: {no_honmei}件')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"

      - name: public_predictions.json の内容確認
        run: |
          echo "=== public_predictions.json ==="
          cat public_predictions.json || echo "public_predictions.json が生成されませんでした"

      - name: LINE配信テキスト確認
        run: cat line_message.txt 2>/dev/null || echo "line_message.txt なし"

      - name: 生成ファイルを Artifact として保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: races-json-${{ github.run_id }}
          path: |
            races.json
            public_predictions.json
            line_message.txt
          retention-days: 7
