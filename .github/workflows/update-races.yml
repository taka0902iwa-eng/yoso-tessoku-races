name: 毎朝レース情報自動更新
on:
  schedule:
    - cron: '30 23 * * *'   # JST 08:30
    - cron: '30 1  * * *'   # JST 10:30
    - cron: '30 3  * * *'   # JST 12:30
  workflow_dispatch:         # 手動実行ボタンあり
jobs:
  update-races:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存パッケージインストール
        run: |
          pip install requests beautifulsoup4 lxml matplotlib
      - name: スクレイピング＋EV計算＋FTPアップロード
        env:
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: python scraper.py
      - name: 今日のraces.jsonをGitHubにコミット保存（翌日の結果照合用）
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          cp races.json races_${TODAY}.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add races_${TODAY}.json
          git diff --cached --quiet || git commit -m "auto: races_${TODAY}.json を保存"
          git push
      - name: 昨日のレース結果を取得してresults.jsonを更新・FTPアップロード
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FTP_HOST:   ${{ secrets.FTP_HOST }}
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: |
          python result_updater.py
      - name: results.jsonをGitHubにコミット保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json ev_calibration.json profit_chart.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: results.json更新 $(date -u +%Y-%m-%d)"
          git push
      - name: races.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('races.json') as f:
                  d = json.load(f)
              races = d.get('races', [])
              print(f'合計: {len(races)}件')
              for sport in ['horse','boat','cycle']:
                  n = len([r for r in races if r.get('sport')==sport])
                  print(f'  {sport}: {n}件')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: results.json の内容確認
        run: |
          python3 -c "
          import json
          try:
              with open('results.json') as f:
                  d = json.load(f)
              s = d.get('summary', {})
              print(f'総戦数: {s.get(\"total\",0)}件')
              print(f'的中率: {s.get(\"hit_rate\",0)}%')
              print(f'収支: +¥{s.get(\"profit\",0):,}')
              records = d.get('records', [])
              print(f'レコード数: {len(records)}件')
              if records:
                  print(f'最新: {records[0].get(\"date\",\"\")} {records[0].get(\"name\",\"\")} {records[0].get(\"result\",\"\")}')
              # 競技別・場所別集計
              by_sport = d.get('by_sport', {})
              for sp, v in by_sport.items():
                  if v.get('total', 0) > 0:
                      print(f'  {sp}: {v[\"total\"]}戦 {v[\"hit_rate\"]}%的中 回収率{v[\"recovery_rate\"]}%')
          except Exception as e:
              print(f'エラー: {e}')
          " || echo "解析失敗"
      - name: results.htmlをConoHaにFTPアップロード
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE: ${{ secrets.FTP_REMOTE }}
        run: |
          python3 -c "
          import ftplib, os
          host     = os.environ.get('FTP_HOST','').strip().replace('\n','').replace('\r','').replace(' ','')
          user     = os.environ.get('FTP_USER','').strip().replace('\n','').replace('\r','').replace(' ','')
          password = os.environ.get('FTP_PASS','').strip().replace('\n','').replace('\r','')
          remote_base = os.environ.get('FTP_REMOTE', '/home/c9048134/public_html/oyatojikka.online/races.json')
          remote_base = remote_base.strip().replace('\n','').replace('\r','').replace(' ','')
          # races.jsonのパスからディレクトリを取得
          base_dir = '/'.join(remote_base.split('/')[:-1])
          remote_path = base_dir + '/results.html'
          print(f'FTPアップロード: {remote_path}')
          if not all([host, user, password]):
              print('FTP環境変数未設定。スキップ')
          else:
              try:
                  with ftplib.FTP(timeout=60) as ftp:
                      ftp.connect(host, 21)
                      ftp.login(user, password)
                      ftp.set_pasv(True)
                      dirs = remote_path.split('/')
                      fname = dirs[-1]
                      dirpath = '/'.join(dirs[:-1])
                      try: ftp.cwd(dirpath)
                      except:
                          path = ''
                          for d in dirs[:-1]:
                              if not d: continue
                              path += '/' + d
                              try: ftp.mkd(path)
                              except: pass
                          ftp.cwd(dirpath)
                      with open('results.html', 'rb') as f:
                          ftp.storbinary(f'STOR {fname}', f)
                      print(f'FTPアップロード完了: {remote_path}')
              except Exception as e:
                  print(f'FTPエラー: {e}')
          "
      - name: LINE配信テキスト確認
        run: cat line_message.txt 2>/dev/null || echo "line_message.txt なし"
      - name: 生成ファイルを Artifact として保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: races-json-${{ github.run_id }}
          path: |
            races.json
            results.json
            ev_calibration.json
            profit_chart.png
            line_message.txt
          retention-days: 7
