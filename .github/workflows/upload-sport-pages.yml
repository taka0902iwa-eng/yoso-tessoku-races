name: 競技別HTMLをConoHaにFTPアップロード

on:
  workflow_dispatch:
  push:
    paths:
      - 'keiba.html'
      - 'kyotei.html'
      - 'keirin.html'
      - 'results.html'
      - 'index.html'
      - 'races.json'

jobs:
  upload-sport-pages:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 競技別HTMLをFTPアップロード
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<EOF
          import ftplib, os
          host     = os.environ.get('FTP_HOST','').strip()
          user     = os.environ.get('FTP_USER','').strip()
          password = os.environ.get('FTP_PASS','').strip()
          base_dir = '/home/c9048134/public_html/oyatojikka.online'
          files    = ['index.html', 'keiba.html', 'kyotei.html', 'keirin.html', 'results.html', 'races.json', '.htaccess']
          if not host:
              print('FTP環境変数未設定。スキップ')
              exit(0)
          try:
              with ftplib.FTP(timeout=60) as ftp:
                  ftp.connect(host, 21)
                  ftp.login(user, password)
                  ftp.set_pasv(True)
                  for fname in files:
                      if os.path.exists(fname):
                          remote = f'{base_dir}/{fname}'
                          with open(fname, 'rb') as f:
                              ftp.storbinary(f'STOR {remote}', f)
                          print(f'FTPアップロード完了: {fname}')
                      else:
                          print(f'ファイルなし（スキップ）: {fname}')
          except Exception as e:
              print(f'FTPエラー: {e}')
              exit(1)
          EOF
